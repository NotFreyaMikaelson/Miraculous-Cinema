<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15112E" />
    <title>Cine Miraculous</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9E%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Hanken+Grotesk:wght@400;500;700;800&display=swap"
    />
  </head>
  <body style="margin:0;background:#15112E;color:#ECEAFB;font-family:system-ui,sans-serif">
    <div id="root">
      <p style="padding:16px">Cargando…</p>
    </div>
    <pre
      id="dbg"
      style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;margin:0;padding:12px;background:#000;color:#fda4af;font-size:12px;white-space:pre-wrap;z-index:99999"
    ></pre>
    <script>
      function show(m) {
        var d = document.getElementById('dbg');
        d.style.display = 'block';
        d.textContent += m + '\n';
      }
      window.addEventListener('error', function (e) {
        show('ERROR: ' + (e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('PROMESA: ' + ((r && (r.stack || r.message)) || r));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
